
services:
  postgres:
    image: postgres:17
    container_name: scenova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scenova
      POSTGRES_USER: scenova_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - scenova_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenova_user -d scenova"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scenova_data:
